apis:
- aid: bitrue:bitrue-spot-api
  name: Bitrue Spot API
  description: >-
    REST API for Bitrue spot trading -- market data (depth, trades, klines, tickers), exchange info, account,
    order placement and cancellation, trade history, deposits and withdrawals, plus a listenKey user data
    stream. Signed endpoints use an API key header and an HMAC SHA256 signature.
  humanURL: https://www.bitrue.com/api_docs_includes_file/spot/index.html
  image: https://static.bitrue.com/img/website/uniframe/logo-20221119.png
  baseURL: https://openapi.bitrue.com
  tags:
  - Spot Trading
  - Market Data
  - Orders
  properties:
  - type: Documentation
    url: https://www.bitrue.com/api_docs_includes_file/spot/index.html
  - type: Documentation
    url: https://github.com/Bitrue-exchange/Spot-official-api-docs
