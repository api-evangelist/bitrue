aid: bitrue

name: Bitrue

description: Bitrue is a centralized cryptocurrency exchange offering spot trading, USDT-margined and coin-margined perpetual futures, copy trading
  and a crypto wallet. It publishes public REST and WebSocket APIs for market data, account and order management, deposits and withdrawals, with
  HMAC-SHA256 signed requests, documented at www.bitrue.com/api-docs and in the Bitrue-exchange GitHub organization.

